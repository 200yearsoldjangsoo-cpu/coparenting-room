/* VOICE: 새벽에도 혼자가 아닌 느낌. 뽀짝하고 다정하게
   IDEA: 온라인 공동육아방 — 방마다 30명, 인형 엄마들이 같이 수유하고 둥가둥가하고 서로 쓰담
   PICTURE: 밤 라운지 3D(달 뜬 창·흔들의자·러그), 실제 접속한 엄마들이 아바타로 보임
   COLOUR and TYPE: 남색 밤, 따뜻한 스탠드, 찬이 노랑 #FFD43B / Jua + Noto Sans KR
   LAYOUT: 입장 화면 → 라운지 + 하단 탭(새벽수유·둥가둥가·미니홈피·육아비서) → 하단 시트 */
:root{--y:#FFD43B;--ink:#2B2118;--rd:#E5484D;--gr:#2E9D5B}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1d38;overflow:hidden;font:15px/1.5 'Noto Sans KR',system-ui,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}
#app>canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font:22px Jua,sans-serif}
#voice{margin-left:auto;pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--y);color:#2B2118;font:20px Jua,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:vp 2.4s ease-in-out infinite;cursor:pointer}
.vchip{border:1px solid #e8d9c2;background:#fff;color:#2B2118;border-radius:999px;padding:6px 10px;font:13px Jua,sans-serif;cursor:pointer}.vchip.on{background:var(--y);border-color:var(--y)}
@keyframes vp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.brand span{background:var(--y);color:var(--ink);font-size:13px;border-radius:999px;padding:1px 10px}
.live{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.93);border-radius:999px;padding:3px 12px;font:14px Jua,sans-serif}
.pill.d{background:var(--y)}
.pill b{color:var(--rd);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ad16b;margin-right:5px;box-shadow:0 0 6px #3ad16b}
.name{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:#fff;border:1.5px solid #2B2118;border-radius:16px;padding:5px 12px 6px;font:700 13px/1.25 'Gowun Dodum','Noto Sans KR',sans-serif;color:#2B2118;letter-spacing:-.2px;text-align:center;white-space:nowrap;box-shadow:0 3px 0 rgba(43,33,24,.18);pointer-events:none}
.name:after{content:'';position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1.5px solid #2B2118;border-bottom:1.5px solid #2B2118;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:3px}
.name i{display:block;font:400 11.5px/1.3 'Gowun Dodum','Noto Sans KR',sans-serif;font-style:normal;color:#7a6a58;margin-top:1px}
.name i:empty{display:none}
.name.me{background:#FFE27A}
.name.me i{color:#5a4632}
.fx{position:absolute;transform:translate(-50%,-100%);font:15px Jua,sans-serif;color:#ff6b8a;background:#fff;border-radius:999px;padding:0 9px;box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;animation:up 1.8s ease-out forwards}
@keyframes up{to{margin-top:-40px;opacity:0}}
.menu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.menu button{font:14px Jua,sans-serif;border:2px solid var(--ink);background:var(--y);border-radius:999px;padding:4px 12px;min-height:38px;cursor:pointer}
.menu button.w{background:#fff}
.menu{gap:8px;padding:8px}
.menu button:first-child{font-size:20px;padding:10px 26px;min-height:58px;min-width:96px}
.patb{padding:10px 22px!important;min-height:50px!important;min-width:84px;font-size:17px!important;border-radius:999px}
.card{position:absolute;right:10px;bottom:92px;width:178px;max-height:38vh;overflow-y:auto;background:rgba(255,255,255,.93);border-radius:14px;padding:7px 9px;box-shadow:0 3px 10px rgba(0,0,0,.25);font-size:11px;line-height:1.35}
.card b{font:14px Jua,sans-serif;font-weight:400;display:block}
.card .bar{height:6px;border-radius:9px;background:#eee;margin:4px 0;overflow:hidden}.card .bar i{display:block;height:100%;background:var(--y);transition:width .3s}
.card button{font:12px Jua,sans-serif;background:var(--ink);color:var(--y);border:0;border-radius:999px;padding:4px 9px;min-height:30px;margin-top:3px;cursor:pointer}
.sw{display:flex;gap:6px;margin:6px 0}.sw span{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.sw span.on{box-shadow:0 0 0 2px var(--ink)}
.dock{position:absolute;left:8px;right:8px;bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dock button{font:12px Jua,sans-serif;background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;min-height:52px;cursor:pointer}
.dock button.on{background:var(--y)}
.dock svg{width:24px;height:24px}
.toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-260%);background:var(--y);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font:14px Jua,sans-serif;transition:transform .3s;white-space:nowrap;visibility:hidden;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast{z-index:60;max-width:90vw;text-align:center}.toast.on{transform:translate(-50%,0);visibility:visible}
/* 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:#fff8ee;border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.05);display:flex;flex-direction:column;z-index:5}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.sh b{font:22px Jua,sans-serif;font-weight:400}
.sh button{margin-left:auto;font:14px Jua,sans-serif;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.sb{padding:4px 14px 40px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.kpick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}.kpick button{font:14px Jua,sans-serif;border:2px solid #eadfcd;background:#fff;border-radius:999px;padding:8px 13px;color:var(--ink);min-height:40px}.kpick button.on{background:var(--y);border-color:var(--ink)}
.cy{background:#bfe2f3;background-image:radial-gradient(#fff 1.2px,transparent 1.3px);background-size:10px 10px;border-radius:16px;padding:10px 12px 10px 10px;margin-bottom:10px;font-family:Dotum,'돋움','Apple SD Gothic Neo',sans-serif}
.cy-in{background:#fff;border:2px solid #8fc3dd;border-radius:12px;padding:8px 12px 12px 24px;position:relative;min-height:200px}
.cy-in:before{content:'';position:absolute;left:7px;top:12px;bottom:12px;width:8px;background:repeating-linear-gradient(#8fc3dd 0 6px,transparent 6px 15px);border-radius:4px}
.cy-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#888;border-bottom:1px dashed #cfe3ee;padding-bottom:4px}.cy-top b{color:#ff6a00}
.cy-bgm{max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1a7fbf}
.cy-title{font:bold 15px Dotum,'Apple SD Gothic Neo',sans-serif;color:#1a7fbf;margin:7px 0}
.cy-prof{display:grid;grid-template-columns:120px 1fr;gap:10px}
.cy-pic{height:132px;border:1px solid #cfe3ee;background:#fbe9de;overflow:hidden;position:relative}.cy-pic canvas{width:100%;height:100%;display:block}
.cy-mood{font-size:11px;color:#888;margin-top:4px}.cy-mood b{color:#ff6a00}
.cy-intro{font-size:13px;line-height:1.5;margin:2px 0 6px;word-break:break-all;white-space:pre-line}
.cy-links a{display:block;font-size:12px;color:#1a7fbf;text-decoration:none;padding:3px 0;border-bottom:1px dotted #d9e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cy-links a.off{color:#bbb}
.cy-sec{margin-top:10px;border-top:2px solid #8fc3dd;padding-top:6px}.cy-sec h4{margin:0 0 6px;font:bold 12px Dotum,sans-serif;color:#1a7fbf;display:flex;justify-content:space-between}
#efx{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(circle at 50% 40%,#fff8ec,#ffe9cf 70%,#f7d9b5);color:#2B2118;animation:efin .45s ease both;transition:opacity .55s ease,transform .55s ease}#efx.out{opacity:0;transform:scale(1.04)}#efx .e0{font-size:54px;animation:efb 1.2s ease-in-out infinite}#efx .e1{font:28px/1.35 Jua,sans-serif}#efx .e2{font:16px Jua,sans-serif;color:#8a6a48}#efx .dots i{font-style:normal;animation:efd 1.2s infinite}#efx .dots i:nth-child(2){animation-delay:.2s}#efx .dots i:nth-child(3){animation-delay:.4s}@keyframes efin{from{opacity:0}to{opacity:1}}@keyframes efb{50%{transform:translateY(-8px)}}@keyframes efd{0%,100%{opacity:.2}50%{opacity:1}}
.cy-news{font-size:12px;line-height:1.7}.cy-news span{color:#ff6a00}
.cy-goal{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted #d9e8f0;font-size:13.5px;line-height:1.4}.cy-goal span{flex:1}.cy-goal button{border:1px solid #ffc2a3;background:#fff4ee;color:#ff6a00;border-radius:99px;padding:4px 10px;font:bold 12px Dotum,sans-serif;white-space:nowrap}.cy-goal button.on{background:#ff6a00;color:#fff;border-color:#ff6a00}
.cy-stamp{font-size:11.5px;color:#888;margin-top:6px}.cy-stamp span{color:#ff6a00}
.cy-work{display:flex;gap:10px;align-items:stretch;border:1px solid #d6e6ee;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:7px;background:#fff}.cy-work img{width:92px;height:115px;object-fit:cover;flex:none;background:#f3efe8}.cy-work div{padding:8px 8px 8px 0;display:flex;flex-direction:column;gap:3px}.cy-work small{font-size:11px;color:#1a7fbf}.cy-work b{font-size:14px;line-height:1.35;color:#2B2118}.cy-work em{font-style:normal;font-size:12px;line-height:1.45;color:#6a5a48}.cy-work i{font-style:normal;font-size:12px;color:#ff6a00;margin-top:auto}
.cy-gb{border:1px solid #d6e6ee;margin-bottom:6px}.cy-gb .h{background:#eef5f9;font-size:11px;color:#666;padding:3px 6px;display:flex;justify-content:space-between}.cy-gb .b{padding:7px;font-size:13px}
.cy-tabs{position:absolute;right:-12px;top:34px;display:flex;flex-direction:column;gap:3px}.cy-tabs a{background:#ff9a3c;color:#fff;font:bold 11px Dotum,sans-serif;padding:7px 3px;border-radius:0 6px 6px 0;writing-mode:vertical-rl;text-decoration:none}.cy-tabs a.g{background:#8fc3dd}
.cy .ebtn{font-size:12px;padding:4px 10px;min-height:28px}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}.atabs button{flex:none;font:14px Jua,sans-serif;border:2px solid #eadfcd;background:#fff;border-radius:999px;padding:7px 13px;color:var(--ink)}.atabs button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.law h5{margin:10px 0 4px;font:15px Jua,sans-serif;font-weight:400}.law li{margin:3px 0;font-size:13px}.law small,.calc small{color:#8a7a68;font-size:11px}
.calc table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.calc td,.calc th{border-bottom:1px solid #f0e2cf;padding:5px 4px;text-align:right}.calc th{background:#f6efe4;font-weight:600}.calc td:first-child,.calc th:first-child{text-align:left}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{font:18px Jua,sans-serif;margin-top:8px}
.lk a{display:block;margin:6px 0;padding:12px;border-radius:14px;background:#fff6ec;border:1.5px solid #f0e2cf;color:var(--ink);text-decoration:none;font-size:14px}.lk a b{font-family:Jua,sans-serif;font-weight:400}
select{width:100%;font:16px 'Noto Sans KR';border:2px solid #eadfcd;border-radius:14px;padding:12px;background:#fff;min-height:50px}
.hint{font-size:12px;color:#2e7d4f;margin:3px 2px 0;min-height:16px;word-break:break-all}
.ebtn{font:13px Jua,sans-serif;background:var(--ink);color:var(--y);border:0;border-radius:999px;padding:6px 12px;min-height:34px}
.zoom{position:absolute;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 86px);display:flex;flex-direction:column;gap:6px;z-index:2}.zoom button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font:20px Jua,sans-serif;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.box{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 0 rgba(43,33,24,.1)}
.t{font:16px Jua,sans-serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.t small{font:12px 'Noto Sans KR';color:#8a7a68}
.chip{display:inline-block;font:12px Jua,sans-serif;background:var(--y);border-radius:999px;padding:1px 9px;margin-right:4px}
.chip.g{background:#f1e9dc}
label{display:block;font-size:12px;color:#7a6a58;margin:6px 0 2px}
input,textarea{width:100%;box-sizing:border-box;font:16px 'Noto Sans KR';border:2px solid #eadfcd;border-radius:14px;padding:12px;min-height:50px;background:#fff;-webkit-appearance:none}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--ink)}
.btn{font:15px Jua,sans-serif;background:var(--y);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;min-height:42px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn.k{background:var(--ink);color:var(--y)}
.btn.r{background:var(--rd);color:#fff}

.sns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sns a{display:block;min-height:52px;border-radius:14px;padding:8px;text-align:center;font-size:12px;background:#fff6ec;border:1.5px solid #f0e2cf;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sns b{display:block;font:14px Jua,sans-serif;font-weight:400}
.mini{height:200px;border-radius:18px;overflow:hidden;background:#fbe9de;margin-bottom:10px;position:relative}
.mini canvas{width:100%;height:100%;display:block}
.mini span{position:absolute;left:10px;top:10px;font:13px Jua,sans-serif;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px}
.gb div{padding:6px 0;border-top:1px dashed #eadfcd}.gb div:first-child{border-top:0}
.gb small{color:#8a7a68}
.stk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stk button{font:13px Jua,sans-serif;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;min-height:34px;cursor:pointer}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #eadfcd}.todo:first-child{border-top:0}
.todo .dd{flex:none;width:52px;text-align:center;font:13px Jua,sans-serif;border-radius:12px;padding:4px 0;background:#fff3c4}
.todo b{display:block}.todo small{color:#8a7a68}
.chat .q{text-align:right;margin:8px 0}.chat .q span{display:inline-block;background:var(--y);padding:6px 12px;border-radius:14px 14px 2px 14px;text-align:left}
.chat .a{margin:8px 0}.chat .a span{display:inline-block;background:#fff;border:1.5px solid #eadfcd;padding:6px 12px;border-radius:14px 14px 14px 2px;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{font:13px Jua,sans-serif;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;min-height:34px;cursor:pointer}
.ask{display:flex;gap:6px;margin-top:6px}.ask .btn{flex:none;white-space:nowrap}
.note{font-size:12px;color:#8a7a68;margin:6px 0 0}
a.kakao{display:block;margin-top:10px;text-align:center;font:15px Jua,sans-serif;background:var(--rd);color:#fff;border-radius:999px;padding:10px;text-decoration:none;box-shadow:0 3px 0 var(--ink)}
/* 입장 */
.gate{position:absolute;inset:0;background:linear-gradient(#22264a,#4b3f74 60%,#c98fb3);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 16px;text-align:center;overflow-y:auto;z-index:10}
.moon{width:60px;height:60px;border-radius:50%;background:#fff3c4;box-shadow:0 0 40px #ffe7a0;margin:8px 0 6px;flex:none}
.gate h1{margin:0;font:32px Jua,sans-serif;font-weight:400}
.gate .sub{opacity:.85;margin:2px 0 12px}
.rooms{width:100%;max-width:360px;margin:12px 0;display:grid;gap:8px}
.r{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;text-align:left}
.r b{font:17px Jua,sans-serif;font-weight:400;display:block}
.r small{color:#8a7a68}

.r .st{flex:none;font:13px Jua,sans-serif;border-radius:999px;padding:3px 10px}
.full{background:#eee;color:#999}.open{background:var(--rd);color:#fff}

.who b{font:17px Jua,sans-serif;font-weight:400}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.opt button:last-child:nth-child(odd){grid-column:1/3}
.opt button{color:var(--ink);border:2px solid #eadfcd;border-radius:14px;padding:8px;font:15px Jua,sans-serif;background:#fff;min-height:44px;cursor:pointer}
.opt button.on{border-color:var(--ink);background:var(--y)}
.go{width:100%;max-width:360px;margin-top:12px;font:20px Jua,sans-serif;background:var(--y);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer}

{

function togSt(k){const add=!mySts.includes(k);mySts=add?mySts.concat(k):mySts.filter(x=>x!==k);if(add&&k=='preg'&&!pregOk())setHd(1);mySts=['preg','baby','todd'].filter(x=>mySts.includes(x));mySt=primSt(mySts);try{localStorage.setItem('cp_sts',JSON.stringify(mySts))}catch(e){}}

const kpick=(id,O,cur)=>'<div class="ksub">'+id+(O===STAGES?' <small style="color:#8a7a68">여러 개 골라도 돼</small>':'')+'</div><div class="opt">'+Object.entries(O).map(([k,v])=>'<button data-'+(O===STAGES?'s':'m')+'="'+k+'" class="'+((Array.isArray(cur)?cur.includes(k):cur==k)?'on':'')+'">'+v+'</button>').join('')+'</div>';

const okHTML=id=>{const n=(me.ex&&me.ex.ok)||0;return '<div class="ksub">큰 아이 <small style="color:#8a7a68">옆에 같이 다녀</small></div><div class="opt" id="'+id+'">'+['없음','1명','2명','3명 이상'].map((l,i)=>'<button data-ok="'+i+'" class="'+(n==i?'on':'')+'">'+l+'</button>').join('')+'</div>'};
function setOk(v){v=Math.max(0,Math.min(3,+v||0));me.ex=Object.assign({},me.ex,{ok:v});try{localStorage.setItem('cp_ok',String(v))}catch(e){}try{if(RM){pushP();ensure(myId,meState(),true)}}catch(e){}}
const hdHTML=id=>'<div class="ksub">내 시기 표시 <small style="color:#8a7a68">다른 엄마한테 보이는 글자</small></div><div class="opt" id="'+id+'"><button data-hd="0" class="'+(me.ex&&me.ex.hd?'':'on')+'">'+(mySts.includes('preg')&&!pregOk()?'동의하고 보여주기':'보여주기')+'</button><button data-hd="1" class="'+(me.ex&&me.ex.hd?'on':'')+'">숨기기</button></div><div class="note" style="font-size:12px;margin-top:4px">고른 시기(임신 중 등)는 이름표·미니홈피에 보여. 숨기면 그냥 \'엄마\'로만 보이고 임신 여부·주수는 서버로 보내지 않아(아바타도 임신 모습이 아니게 바뀜).'+(mySts.includes('preg')?' <details style="margin-top:4px"><summary><b>임신 정보 표시 동의(선택)</b> 내용 보기</summary>· 목적: 방 안 이름표에 시기·임신 주수를 보여주고 아바타를 임신 모습으로 표시<br>· 항목: 임신 여부, 임신 주수<br>· 공개 범위·보유: 방에 접속한 사람에게 실시간으로만 전달하고 서버에 저장하지 않음. 방에서 나가면 사라짐<br>· 거부: 숨기기를 고르면 돼. 숨겨도 모든 기능을 똑같이 쓸 수 있어</details>'+(pregOk()?'':'<div style="font-size:12px">\'동의하고 보여주기\'를 누르면 위 내용에 동의한 걸로 해.</div>'):'')+'</div>';
function pregOk(){try{return localStorage.getItem('cp_pregok')=='1'}catch(e){return false}}
function setHd(v){if(!v&&mySts.includes('preg')&&!pregOk()){try{localStorage.setItem('cp_pregok','1');localStorage.setItem('cp_pregok_at',new Date().toISOString()+'|v1')}catch(e){}}me.ex=Object.assign({},me.ex,{hd:v?1:0});try{localStorage.setItem('cp_hd',v?'1':'0')}catch(e){}try{if(RM){pushP();ensure(myId,meState(),true)}}catch(e){}}
function setTw(v){me.ex=Object.assign({},me.ex,{tw:v?1:0});try{localStorage.setItem('cp_tw',v?'1':'0')}catch(e){}try{if(RM){pushP();ensure(myId,meState(),true)}}catch(e){}}
function drawKinds(){$('kinds').innerHTML=kpick('아이 시기',STAGES,mySts)+kpick('지금 나',MSTATS,myMs)+twHTML('gtw')+okHTML('gok')+hdHTML('ghd');$('kinds').querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{setHd(b.dataset.hd=='1');drawKinds()});$('kinds').querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>{setTw(b.dataset.tw=='1');drawKinds()});$('kinds').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{setOk(b.dataset.ok);drawKinds()});
 $('kinds').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{togSt(b.dataset.s);applyKind()});$('kinds').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{myMs=b.dataset.m;applyKind()})}
function applyKind(){try{localStorage.setItem('cp_st',mySt);localStorage.setItem('cp_ms',myMs)}catch(e){}if(mySt&&myMs){me.kind=kindOf(mySt,myMs);me.ex=Object.assign({},me.ex,{ms:myMs,sg:mySt,sgs:mySts.slice()});try{localStorage.setItem('cp_kind',me.kind)}catch(e){}}else me.kind=null;drawKinds();renderGate()}
function setKind(k){me.kind=k;try{localStorage.setItem('cp_kind',k)}catch(e){}}
function markKind(){drawKinds()}
try{mySt=localStorage.getItem('cp_st')||'';try{mySts=JSON.parse(localStorage.getItem('cp_sts')||'null')||(mySt?[mySt]:[])}catch(x){mySts=mySt?[mySt]:[]}if(mySts.length)mySt=primSt(mySts);myMs=localStorage.getItem('cp_ms')||'';if(localStorage.getItem('cp_tw')=='1')me.ex=Object.assign({},me.ex,{tw:1});if(localStorage.getItem('cp_hd')=='1'||(mySts.includes('preg')&&localStorage.getItem('cp_pregok')!='1'))me.ex=Object.assign({},me.ex,{hd:1});const ok0=+(localStorage.getItem('cp_ok')||0);if(ok0)me.ex=Object.assign({},me.ex,{ok:ok0})}catch(e){}
if(mySt&&myMs){me.kind=kindOf(mySt,myMs);me.ex=Object.assign({},me.ex,{ms:myMs,sg:mySt,sgs:mySts.slice()})}drawKinds();
$('nick').textContent=(me.kind?'지난번 선택 그대로야 · 바뀌었으면 다시 눌러 · ':'별명은 자동으로 붙어 · ')+me.nick;
function others(){return peers.filter(p=>!p.you&&p.state&&p.state.nick)}
function roomCounts(){const c={};others().forEach(p=>{const r=p.state.room;if(r)c[r]=(c[r]||0)+1});return c}
const MAXR=2,TO_VISIT='00000000-0000-0000-0000-00000000a001',TO_MEAL='00000000-0000-0000-0000-00000000a002';
function pickRoom(){const c=roomCounts();for(let r=1;r<=MAXR;r++)if((c[r]||0)<CAP)return r;return 0}
function queuePos(){const w=others().filter(p=>p.state.wait&&p.state.ws<me.ws).length;return w+1}
const inRoomN=()=>others().filter(p=>p.state.room).length+(me.room?1:0);
function renderGate(){try{const ph=window.__phase||phaseNow();$('gate').classList.toggle('day',ph!=='dawn')}catch(e){}const c=roomCounts(),tot=inRoomN();$('gtot').textContent=tot+'명';
 const wq=others().filter(p=>p.state.wait).length+(me.wait?1:0);const rows=[];
 for(let r=1;r<=MAXR;r++){const n=c[r]||0;
  rows.push('<div class="r"><div style="flex:1"><b>'+r+'호방</b><small>'+n+'/'+CAP+'</small><div class="bar"><i style="width:'+Math.min(100,n/CAP*100)+'%"></i></div></div><span class="st '+(n>=CAP?'full">꽉 참':'open">'+(CAP-n)+'자리')+'</span></div>')}
 if(wq)rows.push('<div class="r"><div style="flex:1"><b>대기 줄</b><small>'+wq+'명 기다리는 중 · 자리 나면 순서대로 들어가</small></div></div>');
 $('rooms').innerHTML=rows.join('');
 const r=pickRoom(),go=$('go');
 if(me.wait){go.disabled=true;go.textContent='대기 중 · '+queuePos()+'번째';$('queue').innerHTML='<div style="font-size:13px;color:#8a7a68;margin:6px 0">이 화면을 켜두면 자리 났을 때 진동·소리로 알려주고 바로 들어가</div><button id="unq">대기 그만하기</button>';$('unq').onclick=()=>{me.wait=0;pushP();renderGate()};
  if(r&&queuePos()==1){me.wait=0;seatAlert();enter(r)}return}
 if(!me.kind){go.disabled=true;go.textContent='시기를 골라줘';$('queue').innerHTML='';return}
 if(r){go.disabled=false;go.textContent=r+'호방 입장하기';$('queue').innerHTML='';return}
 go.disabled=true;go.textContent='방 2개 모두 꽉 찼어 ('+(MAXR*CAP)+'/'+(MAXR*CAP)+')';
 $('queue').innerHTML='<button id="q1">대기 줄 서기'+(wq?' · 지금 '+wq+'명 대기':'')+'</button>';
 $('q1').onclick=()=>{me.wait=1;me.ws=Date.now();pushP();try{Notification&&Notification.permission=='default'&&Notification.requestPermission()}catch(e){}renderGate()}}
function seatAlert(){try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.35)}catch(e){}
 try{if(document.hidden&&window.Notification&&Notification.permission=='granted')new Notification('공동육아방 자리 났어!',{body:'지금 바로 들어가는 중이야'})}catch(e){}}
$('go').onclick=()=>{const r=pickRoom();if(me.kind&&r)enter(r)};
/* 한 번 들어온 엄마는 다음부터 시기 고르기 없이 바로 입장 (바꾸려면 미니홈피에서) */
let autoDone=false;function tryAuto(){if(autoDone||me.room||!me.kind)return;let ok=0;try{ok=localStorage.getItem('cp_entered')}catch(e){}if(!ok)return;const r=pickRoom();if(!r){autoDone=true;renderGate();return}autoDone=true;enter(r)}

/* ---------- 3D ---------- */
const T=window.THREE;if(!T){document.body.innerHTML='<p style="padding:40px;font:18px sans-serif">연결이 불안정해 · 새로고침 해줘</p>';throw 0}

const camF=new T.Vector3(0,0,0),CO=new T.Vector3(3.4,14.2,16.2);let zoomK=.8,camYaw=0;const YAX=new T.Vector3(0,1,0);const camOff=()=>CO.clone().applyAxisAngle(YAX,camYaw);

const cyl=(a,b,h,c,x,y,z,seg=24,o)=>mesh(new T.CylinderGeometry(a,b,h,seg),o?M(c,o):c,x,y,z);

function glow(col,size){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);

const SKIN='#ffdcc2';
function avatar(o){o=Object.assign({hair:'#4a3020',top:'#ff8a8a',kind:'preg',bun:1},o);

 const arms=[sph(.1,o.top,-.34,.58,.02,1,1.5,1),sph(.1,o.top,.34,.58,.02,1,1.5,1)];arms.forEach(a=>bod.add(a));

 head.add(sph(.44,SKIN,0,0,0,1.02,.96,.96));

 head.add(sph(.03,'#c25a55',0,-.14,.42,1.4,.6,.5));
 /* 소품 */
 let extra=null;
 if(o.kind=='carrier'){extra=G(sph(.2,'#ffe28a',0,.55,.27,1,1,.7),sph(.16,SKIN,0,.8,.32),sph(.165,'#7a5030',0,.86,.3,1,.7,1),sph(.025,'#2B2118',-.05,.79,.46),sph(.025,'#2B2118',.05,.79,.46));bod.add(extra)}
 if(o.kind=='newborn'){extra=G(sph(.22,'#ffffff',0,.6,.32,1.3,.8,.9),sph(.13,SKIN,.12,.7,.42),sph(.135,'#ffffff',.12,.75,.4,1,.6,1));bod.add(extra);arms[0].position.set(-.22,.6,.3);arms[1].position.set(.22,.6,.3)}
