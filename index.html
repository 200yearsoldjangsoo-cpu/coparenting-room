<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>온라인 공동육아방</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 새벽에도 혼자가 아닌 느낌. 뽀짝하고 다정하게
   IDEA: 온라인 공동육아방 — 방마다 30명, 인형 엄마들이 같이 수유하고 둥가둥가하고 서로 쓰담
   PICTURE: 밤 라운지 3D(달 뜬 창·흔들의자·러그), 실제 접속한 엄마들이 아바타로 보임
   COLOUR and TYPE: 남색 밤, 따뜻한 스탠드, 찬이 노랑 #FFD43B / Jua + Noto Sans KR
   LAYOUT: 입장 화면 → 라운지 + 하단 탭(새벽수유·둥가둥가·미니홈피·육아비서) → 하단 시트 */
:root{--y:#FFD43B;--ink:#2B2118;--rd:#E5484D;--gr:#2E9D5B}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1d38;overflow:hidden;font:15px/1.5 'Noto Sans KR',system-ui,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}
#app>canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font:22px Jua,sans-serif}
.brand span{background:var(--y);color:var(--ink);font-size:13px;border-radius:999px;padding:1px 10px}
.live{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.93);border-radius:999px;padding:3px 12px;font:14px Jua,sans-serif}
.pill.d{background:var(--y)}
.pill b{color:var(--rd);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ad16b;margin-right:5px;box-shadow:0 0 6px #3ad16b}
.name{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.93);border-radius:999px;padding:1px 9px;font:12px Jua,sans-serif;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.2);pointer-events:none}
.name i{font-style:normal;color:#8a7a68}
.name.me{background:var(--y);border:2px solid var(--ink)}
.fx{position:absolute;transform:translate(-50%,-100%);font:15px Jua,sans-serif;color:#ff6b8a;background:#fff;border-radius:999px;padding:0 9px;box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;animation:up 1.8s ease-out forwards}
@keyframes up{to{margin-top:-40px;opacity:0}}
.menu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.menu button{font:14px Jua,sans-serif;border:2px solid var(--ink);background:var(--y);border-radius:999px;padding:4px 12px;min-height:38px;cursor:pointer}
.menu button.w{background:#fff}
.card{position:absolute;right:12px;bottom:96px;width:200px;background:rgba(255,255,255,.96);border-radius:16px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:12px}
.card b{font:16px Jua,sans-serif;font-weight:400;display:block}
.card .bar{height:8px;border-radius:9px;background:#eee;margin:6px 0;overflow:hidden}.card .bar i{display:block;height:100%;background:var(--y);transition:width .3s}
.card button{font:14px Jua,sans-serif;background:var(--ink);color:var(--y);border:0;border-radius:999px;padding:6px 12px;min-height:36px;margin-top:4px;cursor:pointer}
.sw{display:flex;gap:6px;margin:6px 0}.sw span{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.sw span.on{box-shadow:0 0 0 2px var(--ink)}
.dock{position:absolute;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dock button{font:13px Jua,sans-serif;background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;min-height:52px;cursor:pointer}
.dock button.on{background:var(--y)}
.dock svg{width:24px;height:24px}
.toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-260%);background:var(--y);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font:14px Jua,sans-serif;transition:transform .3s;white-space:nowrap;visibility:hidden;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);visibility:visible}
/* 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;height:82%;background:#fff8ee;border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.05);display:flex;flex-direction:column;z-index:5}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.sh b{font:22px Jua,sans-serif;font-weight:400}
.sh button{margin-left:auto;font:14px Jua,sans-serif;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.sb{padding:4px 14px 24px;overflow-y:auto;flex:1}
.box{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 0 rgba(43,33,24,.1)}
.t{font:16px Jua,sans-serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.t small{font:12px 'Noto Sans KR';color:#8a7a68}
.chip{display:inline-block;font:12px Jua,sans-serif;background:var(--y);border-radius:999px;padding:1px 9px;margin-right:4px}
.chip.g{background:#f1e9dc}
label{display:block;font-size:12px;color:#7a6a58;margin:6px 0 2px}
input,textarea{width:100%;font:16px 'Noto Sans KR';border:2px solid #eadfcd;border-radius:12px;padding:8px 10px;background:#fff}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--ink)}
.btn{font:15px Jua,sans-serif;background:var(--y);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;min-height:42px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn.k{background:var(--ink);color:var(--y)}
.btn.r{background:var(--rd);color:#fff}
.btn:disabled{opacity:.5}
.sns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sns a{display:block;border-radius:14px;padding:8px;text-align:center;font-size:12px;background:#fff6ec;border:1.5px solid #f0e2cf;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sns b{display:block;font:14px Jua,sans-serif;font-weight:400}
.mini{height:200px;border-radius:18px;overflow:hidden;background:#fbe9de;margin-bottom:10px;position:relative}
.mini canvas{width:100%;height:100%;display:block}
.mini span{position:absolute;left:10px;top:10px;font:13px Jua,sans-serif;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px}
.gb div{padding:6px 0;border-top:1px dashed #eadfcd}.gb div:first-child{border-top:0}
.gb small{color:#8a7a68}
.stk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stk button{font:13px Jua,sans-serif;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;min-height:34px;cursor:pointer}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #eadfcd}.todo:first-child{border-top:0}
.todo .dd{flex:none;width:52px;text-align:center;font:13px Jua,sans-serif;border-radius:12px;padding:4px 0;background:#fff3c4}
.todo b{display:block}.todo small{color:#8a7a68}
.chat .q{text-align:right;margin:8px 0}.chat .q span{display:inline-block;background:var(--y);padding:6px 12px;border-radius:14px 14px 2px 14px;text-align:left}
.chat .a{margin:8px 0}.chat .a span{display:inline-block;background:#fff;border:1.5px solid #eadfcd;padding:6px 12px;border-radius:14px 14px 14px 2px;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{font:13px Jua,sans-serif;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;min-height:34px;cursor:pointer}
.ask{display:flex;gap:6px;margin-top:6px}.ask .btn{flex:none;white-space:nowrap}
.note{font-size:12px;color:#8a7a68;margin:6px 0 0}
a.kakao{display:block;margin-top:10px;text-align:center;font:15px Jua,sans-serif;background:var(--rd);color:#fff;border-radius:999px;padding:10px;text-decoration:none;box-shadow:0 3px 0 var(--ink)}
/* 입장 */
.gate{position:absolute;inset:0;background:linear-gradient(#22264a,#4b3f74 60%,#c98fb3);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 16px;text-align:center;overflow-y:auto;z-index:10}
.moon{width:60px;height:60px;border-radius:50%;background:#fff3c4;box-shadow:0 0 40px #ffe7a0;margin:8px 0 6px;flex:none}
.gate h1{margin:0;font:32px Jua,sans-serif;font-weight:400}
.gate .sub{opacity:.85;margin:2px 0 12px}
.rooms{width:100%;max-width:360px;margin:12px 0;display:grid;gap:8px}
.r{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;text-align:left}
.r b{font:17px Jua,sans-serif;font-weight:400;display:block}
.r small{color:#8a7a68}
.r .bar{height:8px;background:#f1e9dc;border-radius:9px;overflow:hidden;margin-top:4px}.r .bar i{display:block;height:100%;background:var(--y)}
.r .st{flex:none;font:13px Jua,sans-serif;border-radius:999px;padding:3px 10px}
.full{background:#eee;color:#999}.open{background:var(--rd);color:#fff}
.who{width:100%;max-width:360px;background:#fff;color:var(--ink);border-radius:20px;padding:14px;text-align:left}
.who b{font:17px Jua,sans-serif;font-weight:400}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.opt button:last-child:nth-child(odd){grid-column:1/3}
.opt button{color:var(--ink);border:2px solid #eadfcd;border-radius:14px;padding:8px;font:15px Jua,sans-serif;background:#fff;min-height:44px;cursor:pointer}
.opt button.on{border-color:var(--ink);background:var(--y)}
.go{width:100%;max-width:360px;margin-top:12px;font:20px Jua,sans-serif;background:var(--y);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.go:disabled{opacity:.5}
.q{margin-top:8px;font:14px Jua,sans-serif}
.q button{font:14px Jua,sans-serif;background:none;border:2px solid #fff;color:#fff;border-radius:999px;padding:4px 12px;min-height:36px;cursor:pointer}
.gnote{font-size:12px;opacity:.7;margin-top:12px;max-width:340px}
@media(prefers-reduced-motion:reduce){.sheet,.toast{transition:none}.fx{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div class="top"><div class="brand">온라인 공동육아방 <span>엄마만 입장</span></div>
  <div class="live"><span class="pill"><span class="dot"></span>지금 엄마 <b id="tot">1명</b> 같이 육아 중</span><span class="pill d" id="rm">1호방</span></div></div>
 <div class="card" id="card"></div>
 <div class="toast" id="toast"></div>
 <div class="dock" id="dock">
  <button data-t="feed" class="on"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 1 0 9 9A8 8 0 1 1 12 3z" fill="none" stroke="currentColor" stroke-width="2"/></svg>새벽수유</button>
  <button data-t="dunga"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9.5A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.5C19 15.5 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2"/></svg>둥가둥가</button>
  <button data-t="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>미니홈피</button>
  <button data-t="aide"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>육아비서 찬이</button>
 </div>
 <div class="sheet" id="sheet"><div class="sh"><b id="stt"></b><button id="sx">닫기</button></div><div class="sb" id="sb"></div></div>
 <div class="gate" id="gate">
  <div class="moon"></div><h1>온라인 공동육아방</h1><div class="sub">엄마만 들어올 수 있는 방 · 가입 없이 바로</div>
  <div class="pill" style="color:var(--ink)"><span class="dot"></span>지금 엄마 <b id="gtot">…</b> 같이 육아 중</div>
  <div class="rooms" id="rooms"></div>
  <div class="who"><b>지금 나는?</b><div class="opt" id="kinds"></div><div class="note" id="nick"></div></div>
  <button class="go" id="go" disabled>시기를 골라줘</button>
  <div class="q" id="queue"></div>
  <div class="gnote" id="gnote">방마다 30명까지 같이 있을 수 있어. 꽉 차면 다음 방이 열리거나 대기 줄을 설 수 있어.</div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
{
const app=document.getElementById('app');
const CAP=(()=>{const m=location.hash.match(/^#cap-(\d+)$/);return m?Math.max(1,+m[1]):30})();
const KINDS={preg:{label:'임신 중',top:'#ffd27a'},newborn:{label:'출산 직후',top:'#ffb4c8'},carrier:{label:'육아휴직 중',top:'#a8e6b8'},work:{label:'워킹맘',top:'#9fd3ff'},home:{label:'전업맘',top:'#f6a7b8'}};
const $=id=>document.getElementById(id);
let toastT;function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 나 ---------- */
let uid=null;let myId='p-'+Math.random().toString(36).slice(2,8);
const me={nick:'엄마'+String(1000+Math.floor(Math.random()*9000)),kind:null,room:0,wait:0,ws:0,x:0,z:2,st:'',stAt:0,patTo:'',patAt:0,carrier:0,cc:'#4a4744',steps:0};
let peers=[],RM=null,DB=null,USER=null,SAMPLE=null;

/* ---------- 입장 화면 ---------- */
$('kinds').innerHTML=Object.entries(KINDS).map(([k,v])=>'<button data-k="'+k+'">'+v.label+'</button>').join('');
$('kinds').querySelectorAll('button').forEach(b=>b.onclick=()=>{me.kind=b.dataset.k;$('kinds').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));renderGate()});
$('nick').textContent='별명은 자동으로 붙어 · '+me.nick;
function others(){return peers.filter(p=>!p.you&&p.state&&p.state.nick)}
function roomCounts(){const c={};others().forEach(p=>{const r=p.state.room;if(r)c[r]=(c[r]||0)+1});return c}
function pickRoom(){const c=roomCounts();for(let r=1;r<100;r++)if((c[r]||0)<CAP)return r;return 1}
function queuePos(){const w=others().filter(p=>p.state.wait&&p.state.ws<me.ws).length;return w+1}
function renderGate(){const c=roomCounts(),tot=others().length+1;$('gtot').textContent=tot+'명';
 const maxR=Math.max(1,...Object.keys(c).map(Number));const rows=[];
 for(let r=1;r<=maxR+1&&r<=6;r++){const n=c[r]||0;if(r>maxR&&n==0&&rows.length>=1&&(c[r-1]||0)<CAP)break;
  const wait=r==1?others().filter(p=>p.state.wait).length:0;
  rows.push('<div class="r"><div style="flex:1"><b>'+r+'호방</b><small>'+n+'/'+CAP+(wait?' · 대기 '+wait+'명':'')+'</small><div class="bar"><i style="width:'+Math.min(100,n/CAP*100)+'%"></i></div></div><span class="st '+(n>=CAP?'full">꽉 참':'open">'+(CAP-n)+'자리')+'</span></div>')}
 $('rooms').innerHTML=rows.join('');
 const r=pickRoom(),go=$('go');
 if(me.wait){go.disabled=true;go.textContent='1호방 대기 중 · '+queuePos()+'번째';$('queue').innerHTML='<button id="unq">대기 그만하고 '+r+'호방 들어가기</button>';$('unq').onclick=()=>{me.wait=0;pushP();renderGate()};
  if((c[1]||0)<CAP&&queuePos()==1){me.wait=0;enter(1)}return}
 go.disabled=!me.kind;go.textContent=me.kind?r+'호방 입장하기':'시기를 골라줘';
 $('queue').innerHTML=(c[1]||0)>=CAP&&me.kind?'<button id="q1">1호방은 대기 줄 서기</button>':'';
 const q1=$('q1');if(q1)q1.onclick=()=>{me.wait=1;me.ws=Date.now();pushP();renderGate()}}
$('go').onclick=()=>{if(me.kind)enter(pickRoom())};

/* ---------- 3D ---------- */
const T=THREE;
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=.95;
app.prepend(R.domElement);
const cam=new T.PerspectiveCamera(36,1,.1,100);
function size(){const w=app.clientWidth,h=app.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();cam.position.set(6.4,13.5,16.5);cam.lookAt(.1,.2,-.2)}
const S=new T.Scene();S.background=new T.Color('#1b1d38');
/* ---------- 도우미 ---------- */
const MC={};const M=(c,o)=>{const k=c+JSON.stringify(o||{});return MC[k]||(MC[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o||{})))};
function mesh(g,m,x,y,z,sh=1){const o=new T.Mesh(g,typeof m=='string'?M(m):m);o.position.set(x||0,y||0,z||0);o.castShadow=sh;o.receiveShadow=true;return o}
const sph=(r,c,x,y,z,sx=1,sy=1,sz=1,o)=>{const m=mesh(new T.SphereGeometry(r,24,18),o?M(c,o):c,x,y,z);m.scale.set(sx,sy,sz);return m};
const box=(w,h,d,c,x,y,z,o)=>mesh(new T.BoxGeometry(w,h,d),o?M(c,o):c,x,y,z);
const cyl=(a,b,h,c,x,y,z,seg=24,o)=>mesh(new T.CylinderGeometry(a,b,h,seg),o?M(c,o):c,x,y,z);
const G=(...a)=>{const g=new T.Group();a.forEach(x=>g.add(x));return g};
function glow(col,size){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false,blending:T.AdditiveBlending}));s.scale.set(size,size,1);return s}


/* ---------- 엄마 아바타 ---------- */
const SKIN='#ffdcc2';
function avatar(o){o=Object.assign({hair:'#4a3020',top:'#ff8a8a',kind:'preg',bun:1},o);
 const root=new T.Group(),bod=new T.Group();root.add(bod);
 const feet=[sph(.13,'#5a4033',-.14,.11,.05,1,.7,1.35),sph(.13,'#5a4033',.14,.11,.05,1,.7,1.35)];feet.forEach(f=>bod.add(f));
 const body=sph(.33,o.top,0,.52,0,1,1.05,.92);bod.add(body);
 bod.add(sph(.34,o.top,0,.36,0,1.12,.5,1.05));
 let belly=null;if(o.kind=='preg'){belly=sph(.31,o.top,0,.45,.27,1.05,.95,1);bod.add(belly);bod.add(sph(.08,'#ffffff',-.1,.56,.55,1,1,.4,{transparent:true,opacity:.45}))}
 const arms=[sph(.1,o.top,-.34,.58,.02,1,1.5,1),sph(.1,o.top,.34,.58,.02,1,1.5,1)];arms.forEach(a=>bod.add(a));
