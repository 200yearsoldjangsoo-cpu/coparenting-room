<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>찬이 · 건강보험 불러오기 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f4f1ec;color:#222}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #e5e0d8}
h1{font-size:17px;margin:0 0 4px}p{margin:0;font-size:13px;color:#666;line-height:1.5}
#go{margin:12px 16px;width:calc(100% - 32px);padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:15px;font-weight:700}
#go:disabled{background:#999}
#st{margin:0 16px 8px;font-size:13px;color:#444;min-height:18px}
#bar{margin:0 16px 10px;height:4px;background:#e5e0d8;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#222;transition:width .5s}
#wrap{margin:0 16px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #e5e0d8;display:none}
#form{margin:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#form label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:4px}
#form input,#form select{font-size:16px;padding:10px;border:1px solid #d8d2c8;border-radius:10px;background:#fff}
#big{margin:6px 16px 10px;padding:0;font-size:17px;font-weight:700;line-height:1.5;text-align:center}
#tog{margin:0 16px 10px;background:none;border:0;color:#777;font-size:12px;text-decoration:underline}
#sc{width:1024px;height:800px;transform-origin:0 0}
iframe{width:1024px;height:800px;border:0;display:block}
#out{margin:12px 16px 30px;display:none}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:7px 6px;text-align:left}th{background:#e9e9e9}
pre{white-space:pre-wrap;font-size:11px;background:#fff;padding:10px;border-radius:8px;max-height:300px;overflow:auto}
</style></head><body>
<header><h1>건강보험 자격 불러오기 (테스트)</h1>
<p>이름·생년월일·휴대폰만 적어 주시면 찬이가 건강보험공단 간편인증을 대신 요청해요. 폰에 온 알림에서 <b>승인</b>만 눌러 주세요. 저장은 이 폰에만 돼요.</p></header>
<div id="form">
<label>이름<input id="nm" autocomplete="name"></label>
<label>생년월일 8자리<input id="bd" inputmode="numeric" maxlength="8" placeholder="19940201"></label>
<label>휴대폰<input id="ph" inputmode="numeric" maxlength="11" placeholder="01012345678"></label>
<label>인증 앱<select id="pv"><option>네이버</option><option>카카오톡</option><option>토스</option><option>통신사PASS</option><option>국민인증서</option><option>삼성패스</option></select></label>
</div>
<button id="go">간편인증 요청하기</button>
<div id="bar"><i></i></div>
<div id="st"></div>
<div id="big"></div>
<button id="tog" style="display:none">찬이가 보는 화면 보기</button>
<div id="wrap"><div id="sc"><iframe id="lv" allow="clipboard-read; clipboard-write"></iframe></div></div>
<div id="dbg" style="margin:6px 16px;font-size:11px;color:#888;word-break:break-all"></div>
<div id="out"></div>
<script>
const FN="https://hiqekjtjtycoisjgyrrh.supabase.co/functions/v1/bb-session";
const KEY="sb_publishable_E025XGPHRwWuKHm-Z7DL4A_YARBUw2l";
const $=s=>document.querySelector(s);
function st(t){$('#st').textContent=t}
function bar(p){$('#bar i').style.width=p+'%'}
function parse(text){
  // 건보 자격득실내역: 구분 → 사업장명 → 취득일 날짜 → 상실일 날짜/-
  const KIND=/^(직장가입자|직장피부양자|지역세대주|지역세대원|지역가입자|임의계속가입자|의료급여수급권자|피부양자)$/;
  const D=/^\d{4}[.,\-]\d{2}[.,\-]\d{2}$/;
  const L=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let k=L.indexOf('자격득실내역');if(k<0)k=0;
  const rows=[];
  for(let i=k;i<L.length;i++){
    if(!KIND.test(L[i]))continue;
    const r={kind:L[i],place:'',get:'',lose:''};let n=i+1;
    if(L[n]&&!/^취득일$/.test(L[n])&&!KIND.test(L[n])){r.place=L[n];n++}
    for(let m=n;m<Math.min(n+6,L.length);m++){
      if(m>n&&KIND.test(L[m]))break;
      if(L[m]==='취득일'&&!r.get&&D.test(L[m+1]||''))r.get=L[m+1].replace(/[,\-]/g,'.');
      if(L[m]==='상실일'){r.lose=D.test(L[m+1]||'')?L[m+1].replace(/[,\-]/g,'.'):'';break}
    }
    if(r.get)rows.push(r);
  }
  return rows;
}
function judge(rows){
  if(!rows.length)return '';
  const now=rows.find(r=>!r.lose)||rows[0];
  const work=rows.filter(r=>r.kind==='직장가입자');
  let t='지금 자격: '+now.kind+(now.get?' ('+now.get+'부터)':'');
  t+=' · 직장가입 이력 '+work.length+'건';
  if(now.kind==='직장가입자')t+=' → 재직 중인 근로자로 판단';
  else t+=' → 재직 중인 직장가입은 없음. 사업자 여부는 홈택스에서 이어서 확인';
  return t;
}
const LS='cp_nhis_test';try{const v=JSON.parse(localStorage.getItem(LS)||'{}');['nm','bd','ph','pv'].forEach(k=>{if(v[k])$('#'+k).value=v[k]})}catch(e){}
function fit(){const w=$('#wrap').clientWidth||innerWidth-32;const k=w/1024;$('#sc').style.transform='scale('+k+')';$('#wrap').style.height=(800*k)+'px'}
$('#tog').onclick=()=>{const on=$('#wrap').style.display!=='block';$('#wrap').style.display=on?'block':'none';$('#tog').textContent=on?'화면 숨기기':'찬이가 보는 화면 보기';if(on)fit()};
function big(t){$('#big').textContent=t}
$('#go').onclick=async()=>{
  const nm=$('#nm').value.trim(),bd=$('#bd').value.replace(/\D/g,''),ph=$('#ph').value.replace(/\D/g,''),pv=$('#pv').value;
  if(!nm||bd.length!==8||ph.length<10){st('이름, 생년월일 8자리, 휴대폰을 확인해 주세요');return}
  try{localStorage.setItem(LS,JSON.stringify({nm,bd,ph,pv}))}catch(e){}
  $('#go').disabled=true;big('');window.__stop=0;$('#out').style.display='none';st('찬이가 건강보험공단 여는 중…');bar(5);
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},
      body:JSON.stringify({action:'flow',site:'nhis',name:nm,birth:bd,phone:ph,prov:pv})});
    const rd=r.body.getReader();const dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+2);
        if(!line.startsWith('data: '))continue;const e=JSON.parse(line.slice(6));
        if(e.step==='live'){$('#lv').src=e.live.replace('&debug=true','')+'&navbar=false';$('#tog').style.display='block';st('이름·생년월일·휴대폰 넣고 인증 요청하는 중…');bar(12)}
        else if(e.step==='requested'){if(e.r==='ok'&&!e.msg){big('📱 폰에 온 '+pv+' 알림에서 승인을 눌러 주세요');st('승인하면 찬이가 알아서 다음으로 넘어가요');bar(20)}else{big('자동 입력이 막혔어요 ('+(e.r==='ok'?e.msg:e.r)+')');window.__stop=1}}
        else if(e.step==='wait'){if(window.__stop)st('화면 보기로 직접 진행해 주세요 · '+e.s+'초');else st('승인 기다리는 중 · '+e.s+'초 (130초까지)');bar(20+Math.min(60,e.s/2))}
        else if(e.step==='dbg'){$('#dbg').textContent='찬이 확인: '+e.dr}
        else if(e.step==='login'){big('로그인 완료!');st('자격득실 읽는 중…');bar(85)}
        else if(e.step==='data'){bar(100);big('불러오기 완료');st('');$('#wrap').style.display='none';$('#tog').style.display='none';
          const rows=parse(e.text);const o=$('#out');o.style.display='block';
          if(!rows.length&&e.tables&&e.tables.length){o.innerHTML=e.tables.map(t=>'<table style="margin-bottom:10px">'+t.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+c.replace(/</g,'&lt;')+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>').join('')+'<details><summary style="font-size:12px;margin-top:8px">읽어온 원문 보기</summary><pre></pre></details>';o.querySelector('pre').textContent=JSON.stringify({u:e.u,t:e.t,clicked:e.clicked,al:e.al,btn:e.btn},null,1)+'\n\n'+e.text;}else{
          o.innerHTML=(rows.length?'<p style="font-size:14px;font-weight:700;margin:0 0 8px">'+judge(rows)+'</p><table><tr><th>구분</th><th>사업장</th><th>취득일</th><th>상실일</th></tr>'+rows.map(x=>`<tr><td>${x.kind}</td><td>${x.place}</td><td>${x.get}</td><td>${x.lose||'-'}</td></tr>`).join('')+'</table>':'<p>표를 못 찾았어요. 원문:</p>')+'<details><summary style="font-size:12px;margin-top:8px">읽어온 원문 보기</summary><pre></pre></details>';
          o.querySelector('pre').textContent=JSON.stringify({u:e.u,t:e.t,clicked:e.clicked,al:e.al,btn:e.btn},null,1)+'\n\n'+e.text}}
        else if(e.step==='timeout'){big('');st('승인이 안 와서 닫았어요. 다시 눌러 주세요.');$('#wrap').style.display='none';$('#tog').style.display='none'}
        else if(e.step==='error'){st('오류: '+e.error)}
        else if(e.step==='end'){$('#go').disabled=false;$('#go').textContent='다시 하기'}
      }}
  }catch(err){st('오류: '+err.message);$('#go').disabled=false}
};
</script></body></html>
