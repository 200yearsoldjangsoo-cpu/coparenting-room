<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한옥 코드 3D 시험</title>
<style>html,body{margin:0;height:100%;background:#f4f1ec;overflow:hidden}canvas{display:block}</style>
<script src="lib/three.min.js"></script>
<script src="lib/EffectComposer.js"></script><script src="lib/RenderPass.js"></script><script src="lib/ShaderPass.js"></script>
<script src="lib/CopyShader.js"></script><script src="lib/SimplexNoise.js"></script><script src="lib/SSAOShader.js"></script><script src="lib/SSAOPass.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script><script src="lib/UnrealBloomPass.js"></script>
<script src="lib/HorizontalTiltShiftShader.js"></script><script src="lib/VerticalTiltShiftShader.js"></script><script src="lib/VignetteShader.js"></script><script src="lib/FXAAShader.js"></script>
</head><body>
<script>
const T=THREE;
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=.92;
document.body.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color('#f4f1ec');
const cam=new T.PerspectiveCamera(20,innerWidth/innerHeight,1,200);cam.position.set(24,20,29);cam.lookAt(-.4,1.7,.4);

/* ---------- 질감: 캔버스로 직접 그림 ---------- */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const rnd=(a,b)=>a+Math.random()*(b-a);
function noise(g,w,h,base,amt,n){g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=Math.floor(rnd(-amt,amt));g.fillStyle=v>0?'rgba(255,255,255,'+(v/255)+')':'rgba(0,0,0,'+(-v/255)+')';g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3))}}
const woodTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#d2a678';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=2){g.strokeStyle='rgba(120,70,30,'+rnd(.04,.16)+')';g.lineWidth=rnd(.5,1.6);g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x*.03+y*.2)*2);g.stroke()}},[1,1]);
const darkWood=ctex(256,256,(g,w,h)=>{g.fillStyle='#a77d58';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=2){g.strokeStyle='rgba(80,45,20,'+rnd(.05,.2)+')';g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x*.04+y*.3)*1.5);g.stroke()}},[1,1]);
const plaster=ctex(256,256,(g,w,h)=>noise(g,w,h,'#f2e8d6',14,5000),[2,2]);
const hanji=ctex(256,256,(g,w,h)=>{noise(g,w,h,'#f7efe0',8,2500);g.strokeStyle='#a87b4c';g.lineWidth=5;const n=6,m=9;for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*w/n,0);g.lineTo(i*w/n,h);g.stroke()}for(let j=0;j<=m;j++){g.beginPath();g.moveTo(0,j*h/m);g.lineTo(w,j*h/m);g.stroke()}g.lineWidth=10;g.strokeRect(0,0,w,h)});
const sand=ctex(512,512,(g,w,h)=>noise(g,w,h,'#d9c3a0',18,14000),[3,3]);
const roofBase=new T.MeshStandardMaterial({color:'#4f5865',roughness:.95});
const tileM=new T.MeshStandardMaterial({color:'#6e7886',roughness:.7});
const tileDark=new T.MeshStandardMaterial({color:'#5a6370',roughness:.75});
const mWood=new T.MeshStandardMaterial({map:woodTex,roughness:.75});
const mDark=new T.MeshStandardMaterial({map:darkWood,roughness:.8});
const mPlaster=new T.MeshStandardMaterial({map:plaster,roughness:.95});
const mHanji=new T.MeshStandardMaterial({map:hanji,roughness:.9});
const mStone=new T.MeshStandardMaterial({color:'#cfcac2',roughness:.95});
const mCloth=new T.MeshStandardMaterial({color:'#f6f2ea',roughness:.95,side:T.DoubleSide});
const add=(m,p)=>{m.castShadow=m.receiveShadow=true;(p||S).add(m);return m};
function rbox(w,h,d,r,mat){const s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
 const g=new T.ExtrudeGeometry(s,{depth:d-r*2,bevelEnabled:true,bevelThickness:r,bevelSize:r*.9,bevelSegments:3,curveSegments:4});g.translate(0,0,-(d-r*2)/2);return new T.Mesh(g,mat)}
function box(w,h,d,mat,x,y,z){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return add(m)}

/* ---------- 땅 ---------- */
{const g=rbox(15,.5,12,.35,new T.MeshStandardMaterial({map:sand,roughness:1}));g.position.set(-.6,-.57,.6);add(g)}
/* 돌 기단 + 주춧돌 */
const W=7.2,D=3.6,H=2.3; // 몸채 폭·깊이·기둥 높이
{const g=rbox(W+1.2,.45,D+2.6,.12,new T.MeshStandardMaterial({color:'#d8d2c8',roughness:.95}));g.position.set(0,.22,.5);add(g)}
const colX=[-W/2,-W/6,W/6,W/2],colZ=[-D/2,D/2];
colX.forEach(x=>colZ.forEach(z=>{const s=new T.Mesh(new T.CylinderGeometry(.24,.28,.22,10),mStone);s.position.set(x,.55,z);add(s);
 const c=new T.Mesh(new T.CylinderGeometry(.13,.14,H,12),mDark);c.position.set(x,.66+H/2,z);add(c)}));
/* 벽: 회벽 + 나무 틀 + 창호지 문 */
const y0=.66,y1=.66+H;
function wallPanel(x0,x1,z,face){const w=x1-x0,cx=(x0+x1)/2;const p=box(w-.26,H-.1,.12,mPlaster,cx,(y0+y1)/2,z);
 box(w-.2,.12,.16,mDark,cx,y0+.75,z+face*.01);box(w-.2,.12,.16,mDark,cx,y1-.35,z+face*.01);return p}
// 앞면 3칸: 가운데 두짝문, 좌우 창
{const z=D/2;[[colX[0],colX[1]],[colX[1],colX[2]],[colX[2],colX[3]]].forEach(([a,b],i)=>{wallPanel(a,b,z-.02,1);
 const cx=(a+b)/2;if(i==1){[-1,1].forEach(s=>{const d=box(.85,1.55,.06,mHanji,cx+s*.45,y0+.85,z+.06);box(.9,.08,.09,mDark,cx+s*.45,y0+1.64,z+.07);box(.9,.08,.09,mDark,cx+s*.45,y0+.07,z+.07)});const k=new T.Mesh(new T.TorusGeometry(.05,.015,6,12),new T.MeshStandardMaterial({color:'#8a6a3a',metalness:.5,roughness:.4}));k.position.set(cx,y0+.9,z+.11);add(k)}
 else{box(1.25,.8,.06,mHanji,cx,y0+1.25,z+.06);box(1.33,.08,.09,mDark,cx,y0+1.67,z+.07);box(1.33,.08,.09,mDark,cx,y0+.83,z+.07)}})}
// 옆·뒤 벽
wallPanel(colX[0],colX[3],-D/2+.02,-1);
{const p=box(.12,H-.1,D-.26,mPlaster,-W/2+.02,(y0+y1)/2,0);box(.16,.12,D-.2,mDark,-W/2,y0+.75,0);box(.12,.8,1.1,mHanji,-W/2-.04,y0+1.25,0);
 box(.12,H-.1,D-.26,mPlaster,W/2-.02,(y0+y1)/2,0);box(.16,.12,D-.2,mDark,W/2,y0+.75,0)}
// 창방·도리(기둥 위 가로 부재)
box(W+.4,.22,.26,mDark,0,y1+.08,D/2);box(W+.4,.22,.26,mDark,0,y1+.08,-D/2);box(.26,.22,D+.3,mDark,-W/2,y1+.08,0);box(.26,.22,D+.3,mDark,W/2,y1+.08,0);
/* 툇마루: 널빤지 한 장씩 */
{const tz0=D/2+.12,tz1=D/2+1.35;for(let i=0;i<14;i++){const x=-W/2+.05+i*(W+.1)/14+(W+.1)/28;const b=rbox((W+.1)/14-.04,.12,tz1-tz0,.02,mWood);b.position.set(x,y0+.32,(tz0+tz1)/2);add(b)}
 box(W+.2,.14,.14,mDark,0,y0+.22,tz1);[-W/2,-W/6,W/6,W/2].forEach(x=>{const l=new T.Mesh(new T.CylinderGeometry(.07,.07,.5,8),mDark);l.position.set(x,y0+.0,tz1-.05);add(l);const s=new T.Mesh(new T.DodecahedronGeometry(.14,0),mStone);s.scale.y=.5;s.position.set(x,.48,tz1-.05);add(s)})}
/* 댓돌 */
{const s=rbox(1,.18,.5,.08,mStone);s.position.set(.3,.52,D/2+1.75);add(s)}

/* ---------- 지붕: 팔작지붕, 기와를 한 줄씩 생성 ---------- */
const OH=1.2, ridgeY=y1+2.0, eaveY=y1+.42, RW=W/2+OH, RDp=D/2+OH, Wr=W/2+.35, Gz=1.05, gY=ridgeY-.9;
const prof=v=>Math.pow(v,.72);
function frontPt(u,v,s){const hw=Wr+v*(RW-Wr);const x=u*hw,z=s*v*RDp;const y=ridgeY-(ridgeY-eaveY)*prof(v)+Math.pow(Math.abs(u),5)*.6*v*v;return new T.Vector3(x,y,z)}
function endPt(u,v,s){const x=s*(Wr+v*(RW-Wr));const hz=Gz+v*(RDp-Gz);const z=u*hz;const y=gY-(gY-eaveY)*prof(v)+Math.pow(Math.abs(u),5)*.6*v*v;return new T.Vector3(x,y,z)}
function tiled(fn,s,cols,len){
 const geo=new T.ParametricGeometry((u,v,t)=>{const p=fn(u*2-1,v,s);t.set(p.x,p.y-.05,p.z)},40,16);add(new T.Mesh(geo,roofBase));
 for(let i=0;i<=cols;i++){const u=(i/cols*2-1)*.985;const pts=[];for(let k=0;k<=12;k++){const p=fn(u,.02+k/12*.98,s);pts.push(p)}
  add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),24,.058,6,false),i%2?tileM:tileDark));
  const e=pts[pts.length-1],e2=pts[pts.length-2],dir=e.clone().sub(e2).normalize();const c=new T.Mesh(new T.CylinderGeometry(.075,.075,.05,10),tileDark);c.position.copy(e);c.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);add(c);
  if(i%2==0){const r=new T.Mesh(new T.CylinderGeometry(.045,.045,.45,8),mWood);const p=fn(u,.9,s);p.y-=.17;r.position.copy(p);r.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);add(r)}}}
roofBase.side=T.DoubleSide;
tiled(frontPt,1,44);tiled(frontPt,-1,44);tiled(endPt,1,18);tiled(endPt,-1,18);
// 합각 삼각벽 + 박공 테두리
[-1,1].forEach(s=>{const sh=new T.Shape();sh.moveTo(-Gz,0);sh.lineTo(Gz,0);sh.lineTo(0,ridgeY-gY+.05);sh.lineTo(-Gz,0);const m=new T.Mesh(new T.ShapeGeometry(sh),mPlaster);m.rotation.y=s*Math.PI/2;m.position.set(s*(Wr-.02),gY,0);add(m);
});
// 용마루
{const pts=[];for(let k=0;k<=20;k++){const u=k/20*2-1;pts.push(new T.Vector3(u*(Wr+.15),ridgeY+.1+Math.pow(Math.abs(u),6)*.3,0))}
 add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),40,.17,10,false),tileDark));
 const top=pts.map(p=>p.clone().add(new T.Vector3(0,.13,0)));add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(top),40,.1,8,false),tileM));
 [-1,1].forEach(s=>{const c=new T.Mesh(new T.SphereGeometry(.2,12,10),tileDark);c.scale.set(.8,1.1,.7);c.position.set(s*(Wr+.2),ridgeY+.45,0);add(c)})}
// 내림마루·추녀마루
[[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sz])=>{const pts=[];for(let k=0;k<=10;k++){const v=k/10;const p=frontPt(sx,v,sz);p.y+=.07;pts.push(p)}add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),24,.1,8,false),tileDark));
 const g=[];for(let k=0;k<=4;k++){const v=k/4;g.push(new T.Vector3(sx*(Wr+.02),ridgeY+.05-(ridgeY-gY)*v,sz*Gz*v))}add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(g),10,.08,8,false),tileDark))});

/* ---------- 빨랫줄 ---------- */
{const px=[-W/2-2.3,-W/2-.55],pz=D/2+.9;px.forEach(x=>{const p=new T.Mesh(new T.CylinderGeometry(.06,.07,2.2,8),mWood);p.position.set(x,1.1+.45,pz);add(p)});
 const ropePts=[];for(let k=0;k<=10;k++){const t=k/10;ropePts.push(new T.Vector3(px[0]+(px[1]-px[0])*t,2.55-Math.sin(t*Math.PI)*.15,pz))}const rope=new T.CatmullRomCurve3(ropePts);add(new T.Mesh(new T.TubeGeometry(rope,20,.012,4,false),new T.MeshStandardMaterial({color:'#e8e0d0'})));
 window.CLOTH=[];[.22,.5,.78].forEach((t,i)=>{const p=rope.getPoint(t);const g=new T.PlaneGeometry(.42,.6+i%2*.15,6,8);g.translate(0,-(.3+i%2*.075),0);const m=new T.Mesh(g,mCloth);m.position.copy(p);m.rotation.y=.1;add(m);CLOTH.push(m)})}
/* 작은 소품: 고무신, 장독 하나, 디딤돌 */
{const s=new T.MeshStandardMaterial({color:'#f2f2f4',roughness:.6});[-.12,.12].forEach(o=>{const g=new T.Mesh(new T.SphereGeometry(.12,10,8),s);g.rotation.z=Math.PI/2;g.rotation.y=.2;g.scale.set(1,.6,.7);g.position.set(.3+o,.66,D/2+1.75);add(g)})}
[[1.2,2.9],[1.9,3.6],[2.7,4.3]].forEach(([x,z])=>{const s=rbox(.7,.12,.5,.1,mStone);s.rotation.y=rnd(-.4,.4);s.position.set(x,.06,z);add(s)});

/* 땅 디테일: 자갈·풀·꽃 */
{const gm=new T.MeshStandardMaterial({color:'#9fb07e',roughness:1}),gm2=new T.MeshStandardMaterial({color:'#86a06a',roughness:1});
 for(let i=0;i<70;i++){const x=rnd(-7.6,6.6),z=rnd(-4.8,6.4);if(Math.abs(x)<W/2+.9&&z>-D/2-1.6&&z<D/2+2.2)continue;const s=new T.Mesh(new T.DodecahedronGeometry(rnd(.06,.16),0),mStone);s.scale.y=.5;s.position.set(x,.03,z);add(s)}
 for(let i=0;i<40;i++){const x=rnd(-7.4,6.4),z=rnd(-4.6,6.2);if(Math.abs(x)<W/2+1&&z>-D/2-1.8&&z<D/2+2.4)continue;for(let k=0;k<5;k++){const c=new T.Mesh(new T.ConeGeometry(.03,rnd(.18,.34),4),k%2?gm:gm2);c.position.set(x+rnd(-.1,.1),.1,z+rnd(-.1,.1));c.rotation.set(rnd(-.4,.4),0,rnd(-.4,.4));add(c)}}
 const fc=['#f4a6b5','#f7d27a','#c9b4f0','#ffffff'];for(let i=0;i<26;i++){const x=rnd(3.6,6.2),z=rnd(3.2,5.8);const f=new T.Mesh(new T.SphereGeometry(.06,8,6),new T.MeshStandardMaterial({color:fc[i%4],roughness:.8}));f.position.set(x,.22,z);add(f);const st=new T.Mesh(new T.CylinderGeometry(.01,.01,.22,4),gm);st.position.set(x,.11,z);add(st)}}
/* ---------- 빛 ---------- */
S.add(new T.HemisphereLight(0xfff6ea,0xb9a88f,.55));
const sun=new T.DirectionalLight(0xffefd6,1.25);sun.position.set(-9,16,11);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=6;sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});S.add(sun);
const fill=new T.DirectionalLight(0xdfe8ff,.35);fill.position.set(12,6,-4);S.add(fill);

/* ---------- 후처리: 모서리 그림자(SSAO) + 미니어처 흐림 + 비네트 ---------- */
const comp=new T.EffectComposer(R);comp.addPass(new T.RenderPass(S,cam));
const ssao=new T.SSAOPass(S,cam,innerWidth,innerHeight);ssao.kernelRadius=.9;ssao.minDistance=.0005;ssao.maxDistance=.08;comp.addPass(ssao);
const bloom=new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.05,.5,.95);comp.addPass(bloom);
const hT=new T.ShaderPass(T.HorizontalTiltShiftShader),vT=new T.ShaderPass(T.VerticalTiltShiftShader);hT.uniforms.h.value=1/innerWidth;vT.uniforms.v.value=1/innerHeight;hT.uniforms.r.value=vT.uniforms.r.value=.5;comp.addPass(hT);comp.addPass(vT);
const vig=new T.ShaderPass(T.VignetteShader);vig.uniforms.offset.value=.9;vig.uniforms.darkness.value=.55;comp.addPass(vig);

let t0=performance.now(),ang=0,drag=null;
addEventListener('pointerdown',e=>drag=[e.clientX,ang]);addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(drag)ang=drag[1]+(e.clientX-drag[0])*.008});
function loop(){requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
 CLOTH.forEach((c,i)=>{c.rotation.x=Math.sin(t*1.6+i)*.12;c.rotation.y=.1+Math.sin(t*1.1+i*2)*.08});
 const r=Math.hypot(24,29),a=Math.atan2(24,29)+ang;cam.position.set(Math.sin(a)*r,20,Math.cos(a)*r);cam.lookAt(-.4,1.7,.4);
 comp.render()}
loop();window.__ready=1;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight)});
</script></body></html>
